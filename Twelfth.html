<!--Design a visually attractive admission form using CSS. Apply the CSS box model, borders, margins, padding,
text effects, and appropriate selectors to different form elements.-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marwadi University - Admission Form</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #101d3b, #253d68, #a52b4b);
    min-height: 100vh;
    padding: 35px 15px;
    color: #27364d;
}


header {
    text-align: center;
    color: white;
    margin-bottom: 30px;
}

header h1 {
    font-size: 34px;
    letter-spacing: 2px;
    text-shadow: 2px 3px 5px #0005;
}

header p {
    color: #e5eaf5;
    margin-top: 8px;
    letter-spacing: 1px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 45px #0005;
}

.form-header {
    background: linear-gradient(120deg, #9e1838, #d14b62);
    color: white;
    text-align: center;
    padding: 30px 20px;
}

.form-header h2 {
    font-size: 27px;
    margin-bottom: 8px;
}

.form-header p {
    color: #ffe6ec;
    font-size: 14px;
}

form {
    padding: 35px;
}

fieldset {
    border: 1px solid #dce2ed;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    background: #fbfcff;
}

legend {
    color: #9e1838;
    font-size: 18px;
    font-weight: bold;
    padding: 0 12px;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 14px;
    color: #263b5a;
}

.form-group {
    margin-bottom: 20px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px 15px;
    border: 1.5px solid #d8dfeb;
    border-radius: 8px;
    background: white;
    font-size: 14px;
    color: #27364d;
    outline: none;
    transition: 0.3s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #a51d3b;
    box-shadow: 0 0 0 4px #a51d3b18;
    background: #fff;
}

input::placeholder,
textarea::placeholder {
    color: #a0a9b8;
}

.radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 10px;
}

.radio-group label,
.terms label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    margin: 0;
}

input[type="radio"],
input[type="checkbox"] {
    width: auto;
    accent-color: #a51d3b;
}

textarea {
    height: 100px;
    resize: vertical;
}

input[type="file"] {
    background: #f5f7fb;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

button {
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn {
    background: linear-gradient(120deg, #a51d3b, #d14b62);
    color: white;
    box-shadow: 0 5px 15px #a51d3b40;
}

.submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px #a51d3b60;
}

.reset-btn {
    background: #e8edf5;
    color: #263b5a;
}

.reset-btn:hover {
    background: #d4dce9;
}

footer {
    background: #17233e;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 13px;
}

@media(max-width: 600px) {

    header h1 {
        font-size: 25px;
    }

    form {
        padding: 18px;
    }

    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    fieldset {
        padding: 17px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>
    <h1>MARWADI UNIVERSITY</h1>
    <p>Rajkot, Gujarat | Excellence in Education</p>
</header>

<div class="container">

    <div class="form-header">
        <h2>🎓 Student Admission Form</h2>
    </div>

    <form action="#" method="post">

        <fieldset>

            <legend>👤 Personal Information</legend>

            <div class="row">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text"
                    placeholder="Enter your full name"
                    required>
                </div>

                <div class="form-group">
                    <label>Date of Birth *</label>
                    <input type="date" required>
                </div>

            </div>

            <div class="form-group">
                <label>Gender *</label>

                <div class="radio-group">

                    <label>
                        <input type="radio"
                        name="gender" value="Male" required>
                        Male
                    </label>

                    <label>
                        <input type="radio"
                        name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio"
                        name="gender" value="Other">
                        Other
                    </label>

                </div>
            </div>

            <div class="form-group">
                <label>Upload Photograph</label>
                <input type="file" accept="image/*">
            </div>

        </fieldset>

        <fieldset>

            <legend>📞 Contact Information</legend>

            <div class="row">

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email"
                    placeholder="example@gmail.com"
                    required>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="tel"
                    placeholder="10 digit mobile number"
                    pattern="[0-9]{10}"
                    required>
                </div>

            </div>

            <div class="form-group">
                <label>Full Address</label>
                <textarea placeholder="Enter your complete address"></textarea>
            </div>

            <div class="row">

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="Enter city">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text" placeholder="Enter state">
                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>📚 Academic Information</legend>

            <div class="row">

                <div class="form-group">
                    <label>Last Qualification *</label>

                    <select required>
                        <option value="">Select Qualification</option>
                        <option>10th Pass</option>
                        <option>12th Pass</option>
                        <option>Diploma</option>
                        <option>Graduation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Percentage</label>

                    <input type="number"
                    placeholder="Enter percentage"
                    min="0" max="100">
                </div>

            </div>

            <div class="form-group">
                <label>Select Course *</label>

                <select required>
                    <option value="">Choose Your Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>B.Sc</option>
                    <option>MCA</option>
                    <option>MBA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Admission Session</label>

                <select>
                    <option>2026-2027</option>
                    <option>2027-2028</option>
                </select>
            </div>

        </fieldset>

        <fieldset>

            <legend>👨‍👩‍👦 Parent Information</legend>

            <div class="row">

                <div class="form-group">
                    <label>Father's Name</label>
                    <input type="text"
                    placeholder="Enter father's name">
                </div>

                <div class="form-group">
                    <label>Parent's Mobile Number</label>
                    <input type="tel"
                    placeholder="Enter mobile number"
                    pattern="[0-9]{10}">
                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>📋 Declaration</legend>

            <div class="terms">
                <label>
                    <input type="checkbox" required>
                    I confirm that the information provided
                    above is correct.
                </label>
            </div>

        </fieldset>

        <div class="buttons">

            <button type="submit" class="submit-btn">
                Submit Application →
            </button>

            <button type="reset" class="reset-btn">
                Reset Form
            </button>

        </div>

    </form>

    <footer>
        <p>© 2026 Marwadi University, Rajkot</p>
    </footer>

</div>

</body>
</html>
