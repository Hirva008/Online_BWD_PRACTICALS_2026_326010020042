<!--Create a webpage for a college event containing an event photograph, promotional audio, and an event video.
Provide appropriate controlsfor playing the audio and video.-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Fest 2026 | Student Cultural Event</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg-dark: #0f172a;
      --surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    .media-container img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    audio {
      width: 100%;
      margin-top: 0.5rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 480px;
      display: block;
      border-radius: 8px;
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>Campus Fest 2026</h1>
      <p>Annual Student Cultural & Performance Extravaganza</p>
    </header>

    <section class="card">
      <h2>Fest Photograph</h2>
      <div class="media-container">
        <img 
          src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=80" 
          alt="College Fest Crowd and Stage Lights"
        >
      </div>
    </section>

    <section class="card">
      <h2>Promotional Audio (Fest Anthem)</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 0.5rem;">
        Click play to listen to the fest theme:
      </p>
      <audio controls preload="metadata">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      </audio>
    </section>

    <section class="card">
      <h2>Student Event Video</h2>
      <div class="video-wrapper">
        <video controls preload="metadata">
          <source src="http://googleusercontent.com/generated_video_content/15467209154800104009" type="video/mp4">
          
        </video>
      </div>
    </section>

    <footer>
      <p>&copy; 2026 Student Activity Center. All rights reserved.</p>
    </footer>
  </main>

</body>
</html>
