<!--Create a webpage containing a list of subjects. Use JavaScript arrays and functions to display subject information
when the user selects a subject. Use JavaScript events to make the webpage interactive.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            min-height: 100vh;
            padding: 35px 15px;
            color: #243047;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 36px;
            color: #4338ca;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
            font-size: 16px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .subjects {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px 15px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 5px 15px #00000012;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #818cf8;
            box-shadow: 0 10px 25px #6366f140;
        }

        .card.active {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .card h3 {
            color: #3730a3;
            font-size: 17px;
        }

        .info-box {
            display: none;
            background: white;
            margin-top: 30px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #00000015;
            animation: fadeIn 0.4s ease;
        }

        .info-box h2 {
            color: #4338ca;
            margin-bottom: 15px;
        }

        .info-box p {
            line-height: 1.8;
            color: #475569;
            font-size: 16px;
        }

        .info-box h4 {
            margin-top: 18px;
            color: #7c3aed;
        }

        .tag {
            display: inline-block;
            background: #ede9fe;
            color: #5b21b6;
            padding: 8px 14px;
            border-radius: 20px;
            margin-top: 18px;
            font-size: 13px;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            color: #64748b;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 500px) {
            header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Learning Hub</h1>
        <p>Explore Your Subjects | Learn Something New Every Day</p>
    </header>

    <div class="container">

        <div class="subjects" id="subjectList"></div>

        <div class="info-box" id="infoBox">
            <h2 id="subjectName"></h2>
            <p id="subjectDescription"></p>

            <h4>📚 What You Will Learn</h4>
            <p id="subjectTopics"></p>

            <span class="tag" id="subjectCategory"></span>
        </div>

    </div>

    <footer>
        ✨ Keep Learning, Keep Growing! ✨
    </footer>

    <script>


        const subjects = [
            {
                name: "Entrepreneurship",
                icon: "💡",
                description:
                    "Entrepreneurship is the process of starting and managing a business by identifying opportunities and taking risks.",
                topics:
                    "Business ideas, innovation, startup planning, leadership, marketing and business management.",
                category: "Business & Innovation"
            },

            {
                name: "Mathematics",
                icon: "📐",
                description:
                    "Mathematics is the study of numbers, patterns, calculations and logical problem-solving.",
                topics:
                    "Algebra, geometry, equations, statistics, arithmetic and mathematical reasoning.",
                category: "Numbers & Logic"
            },

            {
                name: "Architectural Organisation of Computers",
                icon: "💻",
                description:
                    "This subject explains the internal structure and working of a computer system, including its hardware components.",
                topics:
                    "CPU, memory, input and output devices, registers, computer architecture and data processing.",
                category: "Computer Technology"
            },

            {
                name: "Programming Practises",
                icon: "⌨️",
                description:
                    "Programming Practises teaches how to write, understand, test and improve computer programs.",
                topics:
                    "Programming logic, algorithms, variables, loops, functions, debugging and problem-solving.",
                category: "Coding & Development"
            },

            {
                name: "Basics of Web Development",
                icon: "🌐",
                description:
                    "Web development is the process of creating websites and web applications using different technologies.",
                topics:
                    "HTML, CSS, JavaScript, webpage design, forms, links and interactive websites.",
                category: "Web & Internet"
            },

            {
                name: "Environmental Science",
                icon: "🌱",
                description:
                    "Environmental Science studies the environment and the relationship between humans and nature.",
                topics:
                    "Ecosystems, biodiversity, pollution, climate change, natural resources and conservation.",
                category: "Nature & Environment"
            }
        ];


        function displaySubjects() {

            const subjectList =
                document.getElementById("subjectList");

            subjects.forEach((subject, index) => {

                const card = document.createElement("div");

                card.className = "card";

                card.innerHTML = `
                    <div class="icon">${subject.icon}</div>
                    <h3>${subject.name}</h3>
                `;


                card.addEventListener("click", function() {

                    showSubject(index);


                    document.querySelectorAll(".card")
                        .forEach(c => c.classList.remove("active"));

                    card.classList.add("active");

                });

                subjectList.appendChild(card);

            });
        }


        function showSubject(index) {

            const selectedSubject = subjects[index];

            document.getElementById("subjectName").textContent =
                selectedSubject.icon + " " + selectedSubject.name;

            document.getElementById("subjectDescription").textContent =
                selectedSubject.description;

            document.getElementById("subjectTopics").textContent =
                selectedSubject.topics;

            document.getElementById("subjectCategory").textContent =
                selectedSubject.category;

            document.getElementById("infoBox").style.display = "block";

        }


        window.addEventListener("load", displaySubjects);

    </script>

</body>
</html>
