<!--Design an HTML5 registration form to collect name, email, password, gender, date of birth, city, course, hobbies,
and address. Use appropriate HTML5 input types and form controls.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #234e70;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        .options {
            margin-top: 8px;
        }

        .options label {
            display: inline-block;
            margin: 5px 12px 5px 0;
            font-weight: normal;
        }

        .options input {
            width: auto;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background-color: #234e70;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #16364f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form action="#" method="post">

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name"
               required autocomplete="name">

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="example@email.com"
               required autocomplete="email">

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password"
               minlength="8" required
               autocomplete="new-password">

        <!-- Gender -->
        <label>Gender:</label>
        <div class="options">
            <label>
                <input type="radio" name="gender"
                       value="Male" required> Male
            </label>
            <label>
                <input type="radio" name="gender"
                       value="Female"> Female
            </label>
            <label>
                <input type="radio" name="gender"
                       value="Other"> Other
            </label>
        </div>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <!-- City -->
        <label for="city">City:</label>
        <select id="city" name="city" required>
            <option value="">-- Select City --</option>
            <option value="Ahmedabad">Ahmedabad</option>
            <option value="Surat">Surat</option>
            <option value="Baroda">Baroda</option>
            <option value="Rajkot">Rajkot</option>
            <option value="Jamnagar">Jamnagar</option>
            <option value="Morbi">Morbi</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
            <option value="Pune">Pune</option>
            <option value="Other">Other</option>
        </select>

        <!-- Course -->
        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="BSc">B.Sc.</option>
            <option value="BCom">B.Com.</option>
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
        </select>

        <!-- Hobbies -->
        <label>Hobbies:</label>
        <div class="options">
            <label>
                <input type="checkbox" name="hobbies"
                       value="Reading"> Reading
            </label>
            <label>
                <input type="checkbox" name="hobbies"
                       value="Music"> Music
            </label>
            <label>
                <input type="checkbox" name="hobbies"
                       value="Sports"> Sports
            </label>
            <label>
                <input type="checkbox" name="hobbies"
                       value="Traveling"> Traveling
            </label>
        </div>

        <!-- Address -->
        <label for="address">Address:</label>
        <textarea id="address" name="address"
                  rows="4"
                  placeholder="Enter your full address"
                  required autocomplete="street-address"></textarea>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</div>

</body>
</html>
