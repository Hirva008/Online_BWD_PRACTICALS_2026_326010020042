<!--Develop a student registration webpage using HTML, CSS, and JavaScript. Validate the user's name, email, password,
gender, and other details before submission. Use functions and events to display validation messages.-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
    background: linear-gradient(135deg, #667eea, #764ba2, #a18cd1);
}

.container {
    width: 100%;
    max-width: 650px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.header .icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.header h1 {
    color: #5141a5;
    font-size: 29px;
}

.header p {
    color: #777;
    margin-top: 8px;
    font-size: 14px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.input-group {
    margin-bottom: 19px;
}

.input-group label {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 7px;
    font-size: 14px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #ddd;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
    background: #fafaff;
}

.input-group input:focus,
.input-group select:focus {
    border-color: #7657d5;
    box-shadow: 0 0 7px rgba(118,87,213,0.2);
}

.gender-box {
    display: flex;
    gap: 20px;
    padding: 10px 0;
    color: #555;
}

.gender-box label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 6px;
}

.gender-box input {
    width: auto;
    accent-color: #7657d5;
}

.error {
    color: #e53935;
    font-size: 12px;
    margin-top: 5px;
    display: block;
    min-height: 15px;
}

.terms {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 12px 0 20px;
    font-size: 13px;
    color: #555;
}

.terms input {
    accent-color: #7657d5;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(102,126,234,0.35);
}

#success {
    display: none;
    text-align: center;
    padding: 15px;
    margin-top: 18px;
    border-radius: 10px;
    background: #e6f8ed;
    color: #18864b;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #999;
    font-size: 12px;
}

@media(max-width: 550px) {
    .container {
        padding: 24px 18px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .header h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">🎓</div>
        <h1>Student Registration</h1>
        <p>Create your account and begin your learning journey!</p>
    </div>

    <form id="registrationForm" novalidate>

        <div class="form-row">

            <div class="input-group">
                <label>Full Name *</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span class="error" id="nameError"></span>
            </div>

            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="example@gmail.com">
                <span class="error" id="emailError"></span>
            </div>

        </div>

        <div class="form-row">

            <div class="input-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="Minimum 8 characters">
                <span class="error" id="passwordError"></span>
            </div>

            <div class="input-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password">
                <span class="error" id="confirmError"></span>
            </div>

        </div>

        <div class="form-row">

            <div class="input-group">
                <label>Phone Number *</label>
                <input type="tel" id="phone" placeholder="10-digit mobile number">
                <span class="error" id="phoneError"></span>
            </div>

            <div class="input-group">
                <label>Date of Birth *</label>
                <input type="date" id="dob">
                <span class="error" id="dobError"></span>
            </div>

        </div>

        <div class="input-group">
            <label>Gender *</label>

            <div class="gender-box">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <span class="error" id="genderError"></span>
        </div>

        <div class="input-group">
            <label>Select Course *</label>

            <select id="course">
                <option value="">-- Select Your Course --</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="B.Tech">B.Tech</option>
                <option value="MCA">MCA</option>
                <option value="MBA">MBA</option>
                <option value="Other">Other</option>
            </select>

            <span class="error" id="courseError"></span>
        </div>

        <div class="input-group">
            <label>Address *</label>
            <input type="text" id="address" placeholder="Enter your address">
            <span class="error" id="addressError"></span>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the Terms and Conditions.</label>
        </div>
        <span class="error" id="termsError"></span>

        <button type="submit">Register Now →</button>

        <div id="success">
            🎉 Registration Successful! Welcome aboard!
        </div>

    </form>

    <div class="footer">
        © 2026 Student Registration Portal 
    </div>

</div>

<script>

function showError(id, message) {
    document.getElementById(id).innerText = message;
}

function clearErrors() {
    document.querySelectorAll(".error").forEach(error => {
        error.innerText = "";
    });
}

function validateName() {
    let name = document.getElementById("name").value.trim();

    if (name === "") {
        showError("nameError", "Name is required!");
        return false;
    }

    if (!/^[A-Za-z]+(?:[ '-][A-Za-z]+)*$/.test(name)) {
        showError("nameError", "Enter a valid name using letters only.");
        return false;
    }

    return true;
}

function validateEmail() {
    let email = document.getElementById("email").value.trim();

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
        showError("emailError", "Email is required!");
        return false;
    }

    if (!pattern.test(email)) {
        showError("emailError", "Enter a valid email address!");
        return false;
    }

    return true;
}

function validatePassword() {
    let password = document.getElementById("password").value;

    if (password.length < 8) {
        showError("passwordError", "Password must contain at least 8 characters!");
        return false;
    }

    if (!/[A-Z]/.test(password) ||
        !/[a-z]/.test(password) ||
        !/[0-9]/.test(password)) {
        showError("passwordError", "Use uppercase, lowercase and a number.");
        return false;
    }

    return true;
}

function validateConfirmPassword() {
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirmPassword").value;

    if (confirm === "") {
        showError("confirmError", "Please confirm your password!");
        return false;
    }

    if (password !== confirm) {
        showError("confirmError", "Passwords do not match!");
        return false;
    }

    return true;
}

function validatePhone() {
    let phone = document.getElementById("phone").value.trim();

    if (!/^[6-9]\d{9}$/.test(phone)) {
        showError("phoneError", "Enter a valid 10-digit mobile number!");
        return false;
    }

    return true;
}

function validateDOB() {
    let dob = document.getElementById("dob").value;

    if (dob === "") {
        showError("dobError", "Please select your date of birth!");
        return false;
    }

    let birthDate = new Date(dob + "T00:00:00");
    let today = new Date();

    if (birthDate >= today) {
        showError("dobError", "Date of birth must be in the past!");
        return false;
    }

    return true;
}

function validateGender() {
    let gender = document.querySelector('input[name="gender"]:checked');

    if (!gender) {
        showError("genderError", "Please select your gender!");
        return false;
    }

    return true;
}

function validateCourse() {
    let course = document.getElementById("course").value;

    if (course === "") {
        showError("courseError", "Please select a course!");
        return false;
    }

    return true;
}

function validateAddress() {
    let address = document.getElementById("address").value.trim();

    if (address.length < 5) {
        showError("addressError", "Please enter a valid address!");
        return false;
    }

    return true;
}

function validateTerms() {
    let terms = document.getElementById("terms").checked;

    if (!terms) {
        showError("termsError", "You must accept the terms and conditions!");
        return false;
    }

    return true;
}

document.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    clearErrors();

    let isValid = true;

    if (!validateName()) isValid = false;
    if (!validateEmail()) isValid = false;
    if (!validatePassword()) isValid = false;
    if (!validateConfirmPassword()) isValid = false;
    if (!validatePhone()) isValid = false;
    if (!validateDOB()) isValid = false;
    if (!validateGender()) isValid = false;
    if (!validateCourse()) isValid = false;
    if (!validateAddress()) isValid = false;
    if (!validateTerms()) isValid = false;

    if (isValid) {
        document.getElementById("success").style.display = "block";

        this.reset();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    } else {
        document.getElementById("success").style.display = "none";
    }

});

document.getElementById("name")
.addEventListener("input", function() {
    showError("nameError", "");
    validateName();
});

document.getElementById("email")
.addEventListener("input", function() {
    showError("emailError", "");
    validateEmail();
});

document.getElementById("password")
.addEventListener("input", function() {
    showError("passwordError", "");
    validatePassword();
});

document.getElementById("confirmPassword")
.addEventListener("input", function() {
    showError("confirmError", "");
    validateConfirmPassword();
});

document.getElementById("phone")
.addEventListener("input", function() {
    showError("phoneError", "");
    validatePhone();
});

</script>

</body>
</html>
